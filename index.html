<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelMate-A Travel Dostt</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>FuelMate</h1>
        <p>Plan Your Fuel Expenses for your Vehicle</p>
    </header>

    <main>
        <section>
            <h2>Plan Your Expenses</h2>

            <label for="distance">Travel distance (km)</label>
            <input type="number" id="distance" placeholder="Enter distance"> <br>

            <label for="Origin">Enter Origin</label>
            <input type="text" id="Origin" placeholder="Enter Origin of your journey">  <br>

            <label for="destination">Enter the destination</label>
            <input type="text" id="destination" placeholder="Enter your destination">

            <button id="calculateBtn">Calculate Fuel</button>
            <p id="result"></p>
        </section>
    </main>

    <script src="js/app.js"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FuelMate – Travel Cost</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <h1 style="text-align: left; color: azure; margin-top: 20px;">FuelMate Your TravelDost</h1>
    </header>

    <main>
        <section class="card">
            <h2>Plan Your Expenses</h2>
            <div class="grid">
                <!-- Row 1 -->
                <div class="field">
                    <label for="Origin">Origin</label>
                    <input type="text" id="Origin" placeholder="Enter origin of your journey" />
                </div>
                <div class="field">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" placeholder="Enter your destination" />
                </div>

                <!-- Row 2 -->
                <div class="field">
                    <label for="distance">Travel distance (km)</label>
                    <input type="number" id="distance" placeholder="Enter distance" min="0.1" />
                </div>
                <div class="field">
                    <label for="fuelprice">Fuel Price</label>
                    <input type="number" id="fuelprice" placeholder="Enter fuel price" />
                </div>

                <!-- Row 3 -->
                <div class="field">
                    <label for="vehicleType">Select Vehicle</label>
                    <select id="vehicleType">
                        <option value="">Choose type</option>
                        <option value="bike">Bike</option>
                        <option value="car">Car</option>
                    </select>
                </div>
                <div class="field">
                    <label for="vehicleModel">Select Vehicle Model</label>
                    <select id="vehicleModel">
                        <option value="">Choose your vehicle</option>
                    </select>
                </div>
            </div>
            <button id="calculateBtn">Calculate Fuel</button>
            <p id="result" class="result-box"></p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>

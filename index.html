<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelMate-A Travel Dostt</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <header style="text-align: left; margin-left: 20px; margin-top: 20px; color: aliceblue;">
        <h1>FuelMate Your Travel Dostt </h1>
        <p>Plan Your Fuel Expenses for your Vehicle</p>
    </header>

    <main>
        <section>
            <h2>Plan Your Expenses</h2>

            <label for="distance">Travel distance (km)</label>
            <input type="number" id="distance" placeholder="Enter distance" min="0.1">

            <label for="Origin">Enter Origin</label>
            <input type="text" id="Origin" placeholder="Enter Origin of your journey">

            <label for="destination">Enter the destination</label>
            <input type="text" id="destination" placeholder="Enter your destination">

            <label for="fuelprice">Enter Fuel Price</label>
            <input type="number" id="fuelprice" placeholder="Enter Fuel price">

            <label for="vehicleType">Select Vehicle</label>

            <select id="vehicleType">
                <option value="bike">Bike</option>
                <option value="car">Car</option>
            </select>

            <label for="vehicleModel">Select Vehicle Model</label>
            <select id="vehicleModel">
                <option value="">Choose your vehicle</option>
            </select>

            <button id="calculateBtn">Calculate Fuel</button>
            <button type="button" id="resetBtn">Reset</button>
            <p id="result"></p>

        </section>

        <aside class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <h2>Trip Summary</h2>
                <p class="dashboard-route" id="dashRoute">Enter trip details to calculate</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <span class="stat-label">Estimated Cost</span>
                    <span class="stat-value" id="dashCost">—</span>
                    <span class="stat-sub" id="dashCostPerKm">Cost per km</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Fuel Required</span>
                    <span class="stat-value" id="dashFuel">—</span>
                    <span class="stat-sub" id="dashFuelRate">Fuel rate</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Distance</span>
                    <span class="stat-value" id="dashDistance">—</span>
                    <span class="stat-sub">Total trip distance</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Vehicle</span>
                    <span class="stat-value" id="dashVehicle">—</span>
                    <span class="stat-sub" id="dashMileage">Mileage</span>
                </div>
            </div>

            <div class="map-container" id="mapContainer">
                <p class="map-title">Route Map</p>
                <p class="map-subtitle">Map integration will appear here</p>
            </div>
        </aside>
    </main>

    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/storage.js"></script>

</body>

</html>
